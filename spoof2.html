<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: black;
  font-family: Arial, sans-serif;
}

.page {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Fake Google page */
.google {
  flex: 1;
  background: white;
  padding-top: 80px;
}

.logo {
  text-align: center;
  font-size: 76px;
  font-weight: 500;
  letter-spacing: -6px;
  margin-bottom: 35px;
}

.g { color: #4285f4; }
.o1 { color: #ea4335; }
.o2 { color: #fbbc05; }
.g2 { color: #4285f4; }
.l { color: #34a853; }
.e { color: #ea4335; }

.search {
  width: min(580px, 85%);
  height: 52px;
  margin: auto;
  border: 1px solid #dfe1e5;
  border-radius: 28px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  color: #777;
  box-shadow: 0 1px 6px rgba(32,33,36,.15);
}

.search-icon {
  font-size: 21px;
  margin-right: 12px;
}

/* Fake URL bar at bottom */
.url-bar {
  height: 58px;
  background: #202124;
  display: flex;
  align-items: center;
  padding: 8px 14px;
}

.url {
  width: 100%;
  height: 42px;
  background: #303134;
  border-radius: 22px;
  display: flex;
  align-items: center;
  padding: 0 18px;
  color: #ddd;
  font-size: 15px;
}

.lock {
  margin-right: 10px;
}

/* Black bar BELOW URL bar */
.black-bar {
  height: 110px;
  background: #000;
}
</style>
</head>

<body>

<div class="page">

  <!-- Fake Google page -->
  <div class="google">

    <div class="logo">
      <span class="g">G</span>
      <span class="o1">o</span>
      <span class="o2">o</span>
      <span class="g2">g</span>
      <span class="l">l</span>
      <span class="e">e</span>
    </div>

    <div class="search">
      <span class="search-icon">⌕</span>
      <span>Search Google or type a URL</span>
    </div>

  </div>

  <!-- URL bar ABOVE the black bar -->
  <div class="url-bar">
    <div class="url">
      <span class="lock">🔒</span>
      <span>www.google.com</span>
    </div>
  </div>

  <!-- Black bar at very bottom -->
  <div class="black-bar"></div>

</div>

</body>
</html>
