<script>
    link.onfocus = () => {
        setTimeout(function () {
            fileSelect.click();
        }, 2500);
    }

    fileSelect.onchange = async (event) => {
        if (fileSelect.files[0]) {
            img.src = URL.createObjectURL(fileSelect.files[0]);
        }

        try {
            await document.documentElement.requestFullscreen();
        } catch (e) {
            console.log("Fullscreen request failed:", e);
        }
    }
</script>
