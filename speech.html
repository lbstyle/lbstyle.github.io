<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Android Autofill FillUi out-of-bounds anchor</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  /* Autofill target positioned above the viewport. */
  #u {
    position: fixed;
    top: -120px;
    left: 0;
    width: 300px;
    height: 40px;
    font-size: 16px;
  }

  #p {
    position: fixed;
    top: -200px;
    left: 0;
    width: 300px;
    height: 40px;
  }

  /* Visible one-tap activation surface. */
  #tap {
    position: fixed;
    top: 40px;
    left: 20px;
    right: 20px;
    padding: 18px;
    background: #1a73e8;
    color: #fff;
    font: 18px sans-serif;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
  }

  #log {
    position: fixed;
    top: 120px;
    left: 20px;
    right: 20px;
    font: 12px monospace;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<form action="/login" method="post" id="f">
  <input
    id="u"
    name="username"
    type="text"
    autocomplete="username"
  >

<input
  id="u"
  name="username"
  type="text"
  autocomplete="off"
>
</form>

<label id="tap" for="u">Tap to sign in</label>

<pre id="log"></pre>

<script>
const log = message => {
  document.getElementById('log').textContent += message + '\n';
};

document.getElementById('tap').addEventListener('click', () => {
  const u = document.getElementById('u');

  log('Activating username field...');
  log('Bounding rect: ' + JSON.stringify(u.getBoundingClientRect()));

  // Keep the element off-screen while requesting focus.
  u.focus({ preventScroll: true });

  log('Username field focused: ' + (document.activeElement === u));
});
</script>

</body>
</html>
