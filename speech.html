<!DOCTYPE html>
<html>
<head>
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Off-screen focused input positioning test</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }

  /* Test target positioned above the viewport. */
  #test {
    position: fixed;
    top: -120px;
    left: 0;
    width: 300px;
    height: 40px;
    font-size: 16px;
  }

  /* Visible activation surface. */
  #tap {
    position: fixed;
    top: 40px;
    left: 20px;
    right: 20px;
    padding: 18px;
    background: #1a73e8;
    color: #fff;
    font: 18px sans-serif;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
  }

  #log {
    position: fixed;
    top: 120px;
    left: 20px;
    right: 20px;
    font: 12px monospace;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<input
  id="test"
  type="text"
  autocomplete="off"
  aria-label="Test field"
>

<div id="tap" role="button" tabindex="0">
  Tap to test
</div>

<pre id="log"></pre>

<script>
const log = message => {
  document.getElementById('log').textContent += message + '\n';
};

function activate() {
  const input = document.getElementById('test');

  log('Activating test field...');
  log('Bounding rect: ' +
      JSON.stringify(input.getBoundingClientRect()));

  input.focus({ preventScroll: true });

  log('Focused: ' +
      (document.activeElement === input));
}

document.getElementById('tap').addEventListener('click', activate);
</script>

</body>
</html>
